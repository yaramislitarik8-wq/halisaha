<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<title>Halı Saha Yayın</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
background:#0d1117;
color:#c9d1d9;
font-family:Arial,sans-serif;
}

.main{
padding:12px;
}

.brand{
text-align:center;
font-size:22px;
font-weight:bold;
color:#58a6ff;
margin-bottom:15px;
}

.title{
font-size:14px;
color:#8b949e;
font-weight:bold;
margin:12px 0 7px;
}

.list{
display:flex;
flex-direction:column;
gap:8px;
margin-bottom:15px;
}

button{
font-family:inherit;
}

.select-btn,
.match-btn{
width:100%;
padding:12px;
background:#161b22;
border:1px solid #30363d;
border-radius:8px;
color:#c9d1d9;
font-weight:bold;
font-size:14px;
}

.select-btn.active,
.match-btn.active{
background:#1f6feb;
border-color:#58a6ff;
color:white;
}

.cameras{
display:flex;
gap:8px;
margin-bottom:9px;
}

.cam-btn{
flex:1;
padding:10px;
background:#161b22;
border:1px solid #30363d;
border-radius:7px;
color:#aaa;
font-weight:bold;
}

.cam-btn.active{
background:#238636;
color:white;
}

.full-btn{
width:100%;
padding:14px;
background:#238636;
border:0;
border-radius:8px;
color:white;
font-size:15px;
font-weight:bold;
margin-bottom:10px;
}

.player{
position:relative;
width:100%;
aspect-ratio:16/9;
background:#000;
border:1px solid #30363d;
border-radius:8px;
overflow:hidden;
}

.player:fullscreen{
width:100vw;
height:100vh;
border:0;
border-radius:0;
}

.player video{
width:100%;
height:100%;
display:block;
background:#000;
object-fit:contain;
}

.exit{
display:none;
position:absolute;
right:12px;
top:12px;
z-index:20;
background:rgba(0,0,0,.8);
color:white;
border:1px solid white;
border-radius:20px;
padding:8px 13px;
}

.player:fullscreen .exit{
display:block;
}

.record-box{
margin-top:15px;
padding:14px;
background:#161b22;
border:1px solid #30363d;
border-radius:9px;
}

.record-title{
font-size:16px;
font-weight:bold;
color:#d2a8ff;
margin-bottom:12px;
}

.record-row{
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;
}

.record-input{
width:75px;
padding:10px;
background:#0d1117;
border:1px solid #30363d;
border-radius:6px;
color:white;
font-size:16px;
font-weight:bold;
text-align:center;
}

.record-btn{
padding:11px 16px;
background:#da3633;
border:0;
border-radius:7px;
color:white;
font-weight:bold;
}

.record-btn:disabled{
opacity:.5;
}

.status{
margin-top:10px;
font-size:14px;
font-weight:bold;
}

.info{
margin-top:6px;
font-size:13px;
color:#8b949e;
}

.download{
display:inline-block;
margin-top:10px;
padding:11px 15px;
background:#238636;
color:white;
text-decoration:none;
border-radius:7px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="main">

<div class="brand">BY TARIK</div>

<div class="title">1. SAHA SEÇİN:</div>

<div class="list">

<button
class="select-btn active"
id="btnAcik"
onclick="selectSaha('acik')">
⚽ AÇIK HALI SAHA
</button>

<button
class="select-btn"
id="btnKapali"
onclick="selectSaha('kapali')">
🏟️ KAPALI HALI SAHA
</button>

</div>

<div class="title">2. MAÇ / TARİH SEÇİN:</div>

<div
class="list"
id="matchList">
</div>

<div class="title">3. KAMERA:</div>

<div class="cameras">

<button
class="cam-btn active"
id="btnCam1"
onclick="changeCamera(1)">
📷 1. Kamera
</button>

<button
class="cam-btn"
id="btnCam2"
onclick="changeCamera(2)">
📷 2. Kamera
</button>

</div>

<button
class="full-btn"
onclick="toggleFullscreen()">
⛶ TAM EKRAN YATAY İZLE
</button>

<div
class="player"
id="player">

<button
class="exit"
onclick="toggleFullscreen()">
✕ Kapat
</button>

<video
id="video"
controls
playsinline
webkit-playsinline
autoplay
preload="auto">
</video>

</div>

<div class="record-box">

<div class="record-title">
🎥 KAYIT AL
</div>

<div class="record-row">

<span>Kaç dk kaydedilsin?</span>

<input
id="recordDuration"
class="record-input"
type="number"
value="1"
min="0.1"
step="0.1">

<span>dk</span>

<button
id="recordBtn"
class="record-btn"
onclick="startRecording()">
🔴 KAYDET
</button>

</div>

<div
id="recordStatus"
class="status">
Hazır.
</div>

<div
id="recordInfo"
class="info">
</div>

<div
id="recordResult"
style="display:none">

<a
id="recordDownload"
class="download"
download>
💾 KAYDI İNDİR
</a>

</div>

</div>

</div>

<script>

/* =========================
   AÇIK SAHA MAÇLARI
========================= */

const acikMaclar=[

{
name:"26 Ağustos - 1. Hafta Maçı",

cam1:"https://cloud3.kamerabulutkayit.com/cameras/47/streaming/sub.m3u8?authorization=Basic%20YWRtaW46W46&audio=1&time=2026-08-26T20:00&duration=01:00:00",

cam2:"https://cloud3.kamerabulutkayit.com/cameras/47/streaming/main.m3u8?authorization=Basic%20YWRtaW46W46&audio=1&time=2026-08-26T20:00&duration=01:00:00"
},

{
name:"02 Eylül - 2. Hafta Maçı",

cam1:"https://ornek-link.m3u8",

cam2:"https://ornek-link2.m3u8"
}

];


/* =========================
   KAPALI SAHA MAÇLARI
========================= */

const kapaliMaclar=[

/* 1. MAÇ */

{
name:"30 Ağustos - Kapalı Saha Maçı",

cam1:"https://cloud3.kamerabulutkayit.com/cameras/46/streaming/main.m3u8?authorization=Basic%20YWRtaW46W46&audio=1&time=2026-08-29T22:00&duration=01:00:00",

cam2:"https://cloud3.kamerabulutkayit.com/cameras/46/streaming/sub.m3u8?authorization=Basic%20YWRtaW46W46&audio=1&time=2026-08-29T22:00&duration=01:00:00"
},

/* 2. MAÇ */

{
name:"30 Ağustos - 2. Maç",

cam1:"https://cloud3.kamerabulutkayit.com/cameras/46/streaming/main.m3u8?authorization=Basic%20YWRtaW46W46&audio=1&time=2026-08-29T23:00&duration=00:00:00",

cam2:"https://cloud3.kamerabulutkayit.com/cameras/46/streaming/sub.m3u8?authorization=Basic%20YWRtaW46W46&audio=1&time=2026-08-29T23:00&duration=00:00:00"
}

];


let saha="acik";
let match=null;
let camera=1;
let hls=null;

const video=
document.getElementById("video");

const player=
document.getElementById("player");


/* =========================
   SAHA SEÇ
========================= */

function selectSaha(x){

saha=x;

document
.getElementById("btnAcik")
.classList.toggle(
"active",
x==="acik"
);

document
.getElementById("btnKapali")
.classList.toggle(
"active",
x==="kapali"
);

renderMatches();

}


/* =========================
   MAÇLARI GÖSTER
========================= */

function renderMatches(){

const box=
document.getElementById("matchList");

box.innerHTML="";

const data=
saha==="acik"
?acikMaclar
:kapaliMaclar;


data.forEach((m,i)=>{

const b=
document.createElement("button");

b.className=
"match-btn"+(i===0?" active":"");

b.textContent=
"📅 "+m.name;

b.onclick=()=>{

document
.querySelectorAll(".match-btn")
.forEach(x=>
x.classList.remove("active")
);

b.classList.add("active");

loadMatch(m);

};

box.appendChild(b);

});


if(data.length){

loadMatch(data[0]);

}

}


/* =========================
   MAÇ YÜKLE
========================= */

function loadMatch(m){

match=m;

camera=1;

updateCamera();

play(m.cam1);

}


/* =========================
   KAMERA DEĞİŞTİR
========================= */

function changeCamera(n){

if(!match || camera===n)
return;

camera=n;

updateCamera();

play(
n===1
?match.cam1
:match.cam2
);

}


function updateCamera(){

document
.getElementById("btnCam1")
.classList.toggle(
"active",
camera===1
);

document
.getElementById("btnCam2")
.classList.toggle(
"active",
camera===2
);

}


/* =========================
   YAYINI OYNAT
========================= */

function play(url){

if(hls){

hls.destroy();

hls=null;

}

video.pause();

video.removeAttribute("src");


if(Hls.isSupported()){

hls=new Hls({

enableWorker:true,

lowLatencyMode:false,

backBufferLength:60,

maxBufferLength:20,

maxMaxBufferLength:30,

maxBufferSize:15*1000*1000,

maxBufferHole:0.5,

liveSyncDurationCount:3,

capLevelToPlayerSize:true,

startLevel:-1

});

hls.loadSource(url);

hls.attachMedia(video);


hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{

video.play().catch(()=>{});

});


hls.on(
Hls.Events.ERROR,
function(event,data){

if(!data.fatal)
return;

if(
data.type===
Hls.ErrorTypes.NETWORK_ERROR
){

hls.startLoad();

}

else if(
data.type===
Hls.ErrorTypes.MEDIA_ERROR
){

hls.recoverMediaError();

}

else{

hls.destroy();

}

});

}

else if(
video.canPlayType(
"application/vnd.apple.mpegurl"
)
){

video.src=url;

video.play().catch(()=>{});

}

}


/* =========================
   TAM EKRAN
========================= */

async function toggleFullscreen(){

try{

if(
document.fullscreenElement
){

await document.exitFullscreen();

return;

}

if(
player.requestFullscreen
){

await player.requestFullscreen();

}

if(
screen.orientation &&
screen.orientation.lock
){

try{

await screen.orientation.lock(
"landscape"
);

}catch(e){}

}

}catch(e){

console.log(e);

}

}


/* =========================
   KAYIT
========================= */

let recorder=null;
let chunks=[];
let recordTimer=null;


function getRecordType(){

const types=[

"video/mp4",

"video/webm;codecs=vp9,opus",

"video/webm;codecs=vp8,opus",

"video/webm"

];


for(
const type of types
){

if(
MediaRecorder.isTypeSupported(type)
){

return type;

}

}

return "";

}


function startRecording(){

if(!match){

alert("Önce maç seç.");

return;

}


if(video.readyState<2){

alert(
"Video henüz hazır değil."
);

return;

}


if(
recorder &&
recorder.state==="recording"
){

return;

}


const minutes=
parseFloat(
document.getElementById(
"recordDuration"
).value
);


if(
!minutes ||
minutes<=0
){

alert(
"Kaç dakika kaydedileceğini yaz."
);

return;

}


const duration=
minutes*60*1000;


const status=
document.getElementById(
"recordStatus"
);

const info=
document.getElementById(
"recordInfo"
);

const result=
document.getElementById(
"recordResult"
);

const button=
document.getElementById(
"recordBtn"
);


result.style.display="none";

button.disabled=true;


const type=
getRecordType();


if(!type){

alert(
"Bu cihaz kayıt özelliğini desteklemiyor."
);

button.disabled=false;

return;

}


let stream;

try{

stream=
video.captureStream();

}catch(e){

alert(
"Video akışı alınamadı."
);

button.disabled=false;

return;

}


if(!stream){

alert(
"Video akışı alınamadı."
);

button.disabled=false;

return;

}


chunks=[];


try{

recorder=
new MediaRecorder(
stream,
{
mimeType:type,

videoBitsPerSecond:3500000,

audioBitsPerSecond:96000
}
);

}catch(e){

alert(
"Kayıt başlatılamadı."
);

button.disabled=false;

return;

}


/* VERİ */

recorder.ondataavailable=
function(e){

if(
e.data &&
e.data.size>0
){

chunks.push(e.data);

}

};


/* BİTİŞ */

recorder.onstop=
function(){

clearTimeout(recordTimer);


const extension=
type.startsWith("video/mp4")
?".mp4"
:".webm";


const blob=
new Blob(
chunks,
{
type:type
}
);


if(blob.size<50000){

status.innerText=
"❌ Kayıt çok küçük oluştu.";

button.disabled=false;

return;

}


const url=
URL.createObjectURL(blob);


const link=
document.getElementById(
"recordDownload"
);

link.href=url;

link.download=
"hali-saha-"+
Date.now()+
extension;


info.innerText=
"🎬 "+
Math.round(minutes*60)+
" saniyelik kayıt hazır.";


result.style.display=
"block";


status.innerText=
"✅ Kayıt tamamlandı!";


button.disabled=false;

};


/* BAŞLAT */

recorder.start(1000);

video.play().catch(()=>{});

status.innerText=
"🔴 Kayıt yapılıyor...";


/*
1 dakika = 60 saniye
*/

recordTimer=
setTimeout(
function(){

if(
recorder &&
recorder.state==="recording"
){

status.innerText=
"⏳ Kayıt hazırlanıyor...";

recorder.stop();

}

},
duration
);

}


/* =========================
   BAŞLANGIÇ
========================= */

renderMatches();

</script>

</body>
</html>
